# ---------------------------------------------------------------------------
# Configuracao do engine Cucumber (BDD)
# ---------------------------------------------------------------------------

# Pacote onde ficam as classes de passos (step definitions)
cucumber.glue=br.com.camisetas.bdd.passos

# Relatorios: HTML (relatorio web) + JSON + JUnit XML.
# O detalhamento Gherkin no console fica a cargo do RelatorioConsoleListener;
# para ver o texto completo dos passos no terminal, acrescente "pretty," abaixo.
cucumber.plugin=html:target/cucumber-reports/relatorio-cucumber.html,\
  json:target/cucumber-reports/cucumber.json,\
  junit:target/cucumber-reports/cucumber-junit.xml

# Nome curto do cenario: a funcionalidade ja aparece como cabecalho do grupo
# no console e como secao no relatorio HTML.
cucumber.junit-platform.naming-strategy=short

# Nao sugerir publicacao dos relatorios no cucumber.io
cucumber.publish.quiet=true
